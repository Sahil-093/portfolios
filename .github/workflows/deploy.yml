name: Deploy Anti-Gravity Portfolios to GitHub Pages

on:
  # Trigger build on push to main branch
  push:
    branches:
      - main
  
  # Automated Cron Rebuild: Runs every 6 hours to fetch fresh Google Sheets data
  schedule:
    - cron: '0 */6 * * *'

  # Manual One-Click Trigger from GitHub Actions Dashboard
  workflow_dispatch:

  # Webhook Trigger (e.g. from Google Apps Script onSheetEdit)
  repository_dispatch:
    types: [sheet_updated]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🌌 Compile Anti-Gravity Static Sites
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: npm run build

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@v4
